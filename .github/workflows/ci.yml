name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Poster template artifacts are fresh
        run: |
          set -uo pipefail
          node internal/feature/calposter/uigame/build-inline.js
          fail=0
          for f in internal/feature/calposter/template.html internal/feature/calposter/uigame/dist/template_uigame.html; do
            want=$(git rev-parse "HEAD:$f")
            got=$(git hash-object "$f")
            if [ "$want" = "$got" ]; then
              echo "fresh: $f ($got)"
            else
              fail=1
              echo "::error::$f 不等于源重建结果（重建 $got ≠ 已提交 $want）：要么产物被手改，要么改完源没跑 node internal/feature/calposter/uigame/build-inline.js"
              git --no-pager diff -- "$f" | head -40 || true
            fi
          done
          exit $fail

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race -timeout 5m ./...

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64 # 手机 Termux 运行目标
          - os: windows
            arch: amd64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Binaries
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.os }}" = "windows" ]; then
            EXT=".exe"
          fi
          go build -trimpath -ldflags="-s -w" -o "dist/xingtabot-${{ matrix.os }}-${{ matrix.arch }}${EXT}" ./cmd/xingtabot
          go build -trimpath -ldflags="-s -w" -o "dist/calshot-${{ matrix.os }}-${{ matrix.arch }}${EXT}" ./cmd/calshot
          cp config.yml dist/
          cp -r config dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xingtabot-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 14
