# 星塔机器人 · 看板娘闲聊兜底（aichat）
#
# 形状由 internal/feature/aichat/deploy.go 定义：结构体声明了哪个键，文件就必须给出值。
# 这份文件不装任何密钥：模型接口的 key 走 creds.json 的 modelApiKey，
# 留空就等于不接线 —— 没配 key 时非命令消息继续静默，与今天的表现一字不差。

# 请求打到哪儿。存完整地址而不是域名根：换自建反代、换官方直连、换别家的
# OpenAI 形态服务，都只改这一行。
# 换协议族（比如 Google 原生 generateContent）改不动 —— 那要再写一个实现文件。
endpoint: https://gemini-proxy.zheng1950537289.workers.dev/v1beta/openai/chat/completions

# 问哪个模型。写具体型号，别用 -latest 之类别名：别名把"用哪一档额度"这件事
# 交给厂商，而 Flash 与 Flash-Lite 的日额度差一个数量级（控制台实测 20 vs 500）。
model: gemini-3.5-flash-lite

# 整趟的时间预算，含反代那一跳。超时就静默丢弃这条，绝不占用命令流。
# 兜底跑在机制层的第二条被动流上，串行消费，所以这个数直接决定闲话的最大吞吐。
timeout: 5s

# 出网代理，支持 http:// 与 socks5://（Go 原生认这两种，不需要额外依赖）。
# 留空写 ""：表示不建自定义 Transport —— 那时 Go 仍会读 HTTP(S)_PROXY 环境变量。
# 一旦在这里写明代理，本机的 NO_PROXY 分派对这个 client 就失效了。
# workers.dev 在国内的可达性待实测；不通就填本机 Clash 的 http://127.0.0.1:7897。
proxy: ""

# 同一个人两句话之间的最小间隔。命中时只回 cd_reply 那一句，零 API 调用。
# 按"会话目标 × 说话人"记，所以换群不继承，同一个人刷屏不会打穿上游。
cooldown: 15s

# 全局每分钟最多问上游几次。12 是给免费档留余量的保守值，
# 具体 RPM 只能在自己项目的 AI Studio 控制台看到，Google 已不在文档里公布数字。
max_per_min: 12

# 一次回答最多输出多少 token，约等于 150~200 个汉字。
# 卡这个数是为了群里不刷屏，也顺手把生成耗时按住；日志里 finish=length 那条
# 就是"该调这个数"的依据。
max_output_tokens: 300

# 采样温度。0 到 2 之间，0 是合法值（完全不要扰动）。
# 活动日程与截止时间是强事实内容，0.3 既保住看板娘的语气，又压住它在日期上胡编。
temperature: 0.3

# 注入上下文的活动列表最多几条，三段合计。超出的条目在列表里标"其余 N 条未列出"，
# 免得模型把截剩的当成全部、回一句"一共就这三个活动"。
max_prompt_events: 8

# 说话太快时回的那句。必须含字面量 %d，运行时换成还要等的秒数（向上取整）。
# 不用 fmt.Sprintf 而只认这个字面量：文案里别的百分号不该被当成动词吃掉。
cd_reply: 你说话太快啦，请 %d 秒后再来找我吧~
