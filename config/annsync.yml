# 星塔机器人 · 公告同步引擎（annsync）
#
# 形状由 internal/annsync/deploy.go 定义：结构体声明了哪个键，文件就必须给出值。
# 五项都必须是正数 —— 0 不是"用默认"，是各自那个机制失去约束（见下面每条的后果）。

# 隔多久同步一轮官网公告（列目录 + 抓新增详情 + 重投影）。设太小就是在捶官网。
interval: 30m

# 隔多久做一次全量校准：不看增量、把列表整页重抓一遍。它是"漏了什么"的兜底，
# 设成 <= interval 就等于每轮全量。
fullEvery: 24h

# 同一轮里相邻两次详情抓取之间的最小间隔。这个数是官网限流实测换来的：
# 不加间隔会被拒，被拒之后整轮抓取作废。
minGap: 1s

# 失败退避基数：第 n 次连续失败等 base × 2^(n-1)，上限 max(2h, interval)。
# 调它改变的是"官网抽风多久之后我们恢复抓取"。
backoffBase: 1m

# 公告保留期：超过这个年龄的公告不进日历投影。必须是正数 —— 0 在代码里的含义是
# "关闭过滤"（sync.go 判的是 if > 0），不是"全部过滤掉"，那是给库调用者的出口，不是缺省。
# 95 天 = 2280h 的推导：常驻玩法判据要同名 ≥2 期同时留在窗口里，所以窗口必须
# ≥ 2× 相邻公告的最大发布间隔；真库 352 篇实测各玩法间隔上限 41 天（猎影合围Beta），
# 2×41 = 82，再留一整期的迟到量 → 95。取 63 时它刚好漏过 41 那一档：09-21 起
# 猎影合围Beta 被判成非周期玩法，而它当期还在开。
# 时长写法不认 "d"（time.ParseDuration 的语法），所以 95 天只能写成 2280h。
retention: 2280h
