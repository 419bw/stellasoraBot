# 星塔机器人 · B站动态推图（biliwatch）
#
# 形状由 internal/feature/biliwatch/deploy.go 定义：结构体声明了哪个键，文件就必须给出值。
# 这份文件不装任何密钥：B站登录态 Cookie 走 creds.json 的 biliCookie，留空就是匿名访客。

# 隔多久问一次 B站有没有新动态。启动那一轮立刻跑，不等这个周期。
# 调小 = 更早推到，但也更频繁地打向 B站 —— 没配 Cookie 时这是风控问题，不是刷新率问题。
interval: 5m

# 监听哪个 B站账号的动态。改它 = 不再监听官方号《星塔旅人》；留空不合法，
# 因为那意味着一个谁都不问的空转轮询。加引号只是为了看出它是编号不是数字 ——
# 字符串字段按 YAML 原文取值，不加引号也不会把前导零吃掉。
uid: "3546645778139206"
