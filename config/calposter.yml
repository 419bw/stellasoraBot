# 星塔机器人 · 版本日历海报（calposter）
#
# 这份文件的形状由 internal/feature/calposter/deploy.go 定义：结构体声明了哪个键，
# 文件就必须给出值 —— 代码里已经没有默认值可退，少一个键就启动失败并点名。
# 时长写 5m / 17h / 20s 这样的字符串（time.ParseDuration 的语法），不认 300000000000。

# 版本"开闸"相对活动开始时刻的估计，17h 即 17:00。官方公告只写"维护结束后开启"，
# 00:00 是下界不是时刻。这一个值同时决定三件事：「日历」命令答哪一版、常驻玩法判据的
# 起点、渲染条带的开闸线，并且以 openOffsetMs 烘进 PNG 字节。改它=改渲染口径。
openAt: 17h

# 主动推图相对开闸估计再等这么久才发。0 是合法值 = 开闸即推；给正数是因为官方版本公告
# 与海报要先传上 CDN，开闸那一刻推出去的是一张海报位全是斜纹占位的图。
# 只影响推送时刻与补推预算（pushGrace 从"该推送的时刻"起算），不影响上面那个开闸估计。
pushDelay: 30m

# 后台轮隔多久看一眼"公告数据变了没"，变了就去预热海报。启动时先跑一轮，不等这个周期。
warm: 5m

# 一轮里并发下载海报的个数。0 不是"退化成串行"，是把那一轮永久卡住：抓海报用无缓冲
# channel 派发，worker 一个都没起就没人消费，而命令回图正走在这条路上。
workers: 4

# 单张海报一次抓取的时间预算。超时就画斜纹占位继续走 —— 缺海报不是失败，
# 维护公告切出来的条目本来就没有自己的海报。
perImage: 20s

# 没拿到的那个地址隔多久再试一次（失败冷却）。太短就是在反复捶海报 CDN 那台前置域。
retryAfter: 10m
