# 星塔机器人 · 查活动（calquery）
#
# 形状由 internal/feature/calquery/deploy.go 定义：结构体声明了哪个键，文件就必须给出值。

# 「活动/快结束/即将」每页列几条。为 0 会让分页的除法除零，而崩在用户敲命令那一刻
# 而不是启动那一刻 —— 所以加载时就拒绝。
pageSize: 8

# 「快结束」不带参数时看未来多久。这个数字会被烘进群友看到的命令用法里
# （「快结束 —— 未来 48 小时内… 结束的活动」），改成别的值记得瞄一眼那句话。
defaultEndLead: 48h

# 「即将」不带参数时的天数。同样会出现在命令用法文本里。
defaultSoonDays: 7

# 「即将」的天数上限：带参数问得更远也只到这里。必须 >= defaultSoonDays，
# 否则不带参数的默认查询会超出自己的上限。
maxDays: 60
